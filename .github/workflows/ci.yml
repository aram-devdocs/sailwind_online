name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Repo guards: instruction-layer conventions, the leak scan, and the game-IP
  # guard. Fast, and required. The leak blocklist comes from a repo secret; when
  # it is unset the scan reports "skipped" and passes (external contributors are
  # not blocked), so set the LEAK_BLOCKLIST secret to activate it in CI.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instruction-layer conventions
        run: bash scripts/check-conventions.sh
      - name: Leak scan
        env:
          LEAK_BLOCKLIST: ${{ secrets.LEAK_BLOCKLIST }}
        run: |
          if [ -n "$LEAK_BLOCKLIST" ]; then
            printf '%s' "$LEAK_BLOCKLIST" > "$RUNNER_TEMP/leak-blocklist.txt"
            export SW_LEAK_BLOCKLIST="$RUNNER_TEMP/leak-blocklist.txt"
          fi
          bash scripts/check-no-leak.sh
      - name: Game-IP guard
        run: bash scripts/guard-no-game-ip.sh
      - name: Governance hook golden-fixture suite
        run: bash scripts/test-hooks.sh

  # Pure C# tier: the game-free solution filter and every game-free test project
  # (contracts, net, sync, and the Cecil architecture DAG). No game DLLs ever
  # enter cloud CI; the net472 plugins build locally.
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build game-free solution filter
        run: dotnet build SailwindOnline.CI.slnf -c Release
      - name: Game-free tests (contracts, net, sync, architecture)
        run: dotnet test SailwindOnline.CI.slnf -c Release --no-build

  # Rust server workspace on both target OSes (home servers run on Windows).
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # Regenerate the committed FlatBuffers output from contracts/fbs and fail on
  # any drift: a schema change must land with its regenerated code.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned flatc
        run: bash scripts/get-flatc.sh
      - name: Regenerate C# and Rust from contracts/fbs
        run: bash scripts/gen-contracts.sh
      - name: Fail on drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated contracts drifted from contracts/fbs. Run 'make contracts' and commit the result."
            exit 1
          fi

  # Recompute the canonical SHA-256 of manifest/api-surface.json and fail on any
  # drift from the committed api-surface.sha256 or the embedded SurfaceManifest.Hash.
  # Game-free like the contracts drift job above: it reads only committed repo files
  # and a source literal (no lib/, no game DLL), so it runs in cloud CI.
  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: API surface manifest integrity (hash chain)
        run: dotnet test tests/Sailwind.Api.SurfaceManifest.Tests -c Release

  # Line-coverage gate for the game-free tiers: the C# solution filter
  # (coverlet.collector -> Cobertura, merged by ReportGenerator) and the Rust
  # server workspace (cargo llvm-cov), each enforced against a fail-under floor
  # by scripts/coverage.sh so a coverage regression fails the required gate.
  # Deterministic: pinned dotnet, a pinned Rust toolchain with the
  # llvm-tools-preview component, and pinned coverage tools. Game-free like the
  # dotnet job (no lib/, no game DLL). The merged report is published as an
  # artifact.
  coverage:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install pinned coverage tools
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.3.11
          cargo install cargo-llvm-cov --version 0.6.16 --locked
      - name: Coverage gates (C# + Rust, with thresholds)
        run: bash scripts/coverage.sh
      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage
          if-no-files-found: error

  # End-to-end conformance: real LiteNetLib client against the real Rust server
  # over real FlatBuffers envelopes. Interop is milestone M3, so this job is
  # allowed to fail for now without blocking the gate.
  smoke:
    needs: [dotnet, rust]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build server (release)
        working-directory: server
        run: cargo build --release --bin sw-server
      - name: Run protocol-smoke against the built server
        run: dotnet run --project tools/protocol-smoke -c Release -- --server server/target/release/sw-server

  # Coverage-guided fuzzing of the wire decoder. cargo-fuzz needs a nightly
  # toolchain and the sanitizer runtime, so the fuzz crate lives OUTSIDE the
  # stable server workspace (server/fuzz, excluded) and this job is allowed to
  # fail without blocking the gate. A short run per push; a crash surfaces as a
  # reproducer artifact under server/fuzz/artifacts.
  fuzz:
    needs: [rust]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz decode_envelope (short)
        # Run from `server/`, the directory that holds the `fuzz/` sub-crate;
        # cargo-fuzz resolves `./fuzz/Cargo.toml` from here.
        working-directory: server
        run: cargo +nightly fuzz run decode_envelope -- -max_total_time=30

  # Headless load test: N simulated clients drive the real message handlers and
  # snapshot broadcast, and the per-tick work must stay under the real-time tick
  # budget. It is wall-clock timed, so it lives as an `#[ignore]`d test kept out
  # of the required `rust` job (which must stay deterministic) and is run here
  # allowed-to-fail.
  load:
    needs: [rust]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Run the headless load test
        working-directory: server
        run: cargo test -p sailwind-online-server --release -- --ignored --nocapture load_

  # The single required status check. It is trivial and only turns green once
  # its needs have all passed, so branch protection lists exactly this context.
  gate:
    needs: [guards, dotnet, rust, contracts, surface, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: echo "guards, dotnet, rust, contracts, surface and coverage are green."
