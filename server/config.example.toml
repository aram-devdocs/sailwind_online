# Sailwind Online server configuration (init-0).
# Copy to config.toml and adjust. Values shown are the built-in defaults.

# UDP address the authoritative server binds to.
bind = "0.0.0.0:38455"

# SQLite database file (created + migrated at boot). WAL journal mode.
db_path = "sailwind.db"

# Fixed simulation / network pump rate in Hz.
tick_hz = 30

# Snapshot broadcast rate in Hz (advertised to clients in the capability manifest).
snapshot_hz = 4

# Interval in seconds between standalone world-clock broadcasts (the periodic
# clock authority tick; the join-time clock rides inside ServerHello).
clock_broadcast_secs = 10

# Area-of-interest radius in grid cells (advertised to clients). A radius r is a
# (2r+1)x(2r+1) block of cells; per-recipient snapshot bandwidth tracks the
# entity density inside that block, not the global population. Must be in
# 1..=16 (the ceiling keeps the (2r+1)^2 block allocation bounded).
aoi_radius_cells = 2

# Grid cell size in metres (advertised to clients). Must be finite and in
# (0, 1000000]. Larger cells mean coarser interest management (fewer, bigger
# cells); smaller cells mean tighter culling at more boundary crossings.
cell_size_m = 1024.0

# Minimum interval in milliseconds between any two accepted shared-market trades
# by the same player, aggregated across all ports (a per-player throttle). It is
# rotation-proof: a player cannot exceed the configured rate no matter how many
# distinct ports they trade at. A new trade inside this window is rejected with a
# MarketStateAck; an idempotent replay of an already-applied trade is never
# throttled. Must be in 0..=3600000 (0 disables the throttle).
trade_min_interval_ms = 250

# ClientHello throttle in milliseconds. Per-peer throttling runs before
# protocol/hash validation, database access, and ServerHello generation. Source
# IP session admission uses max(hello_min_interval_ms,
# 2 * new_session_min_interval_ms + 1), which reserves one complete global
# admission window for other source IPs after a source wins a slot. Keep the
# hello interval at or below the client's 250 ms retry cadence so a lost
# ServerHello can be retried on the next attempt. Must be in 1..=250; zero would
# disable pre-authentication protection.
hello_min_interval_ms = 250

# Process-wide minimum interval between database admissions for identities
# without an active session. Active-identity reconnects have a separate
# per-player window, so reconnect churn cannot monopolize this new-identity
# budget. Must be in 1..=1000.
new_session_min_interval_ms = 30

# Hard ceilings on live LiteNetLib transport peers, including peers that have
# not authenticated yet. The per-IP ceiling prevents source-port rotation from
# consuming the global peer budget. Both must be positive, the global value may
# not exceed 65535, and the per-IP value may not exceed the global value.
max_transport_peers = 1024
max_transport_peers_per_ip = 16

# Hard ceiling on persistent player rows. Existing identities can reconnect
# after the table reaches this limit; new identities are refused without
# creating session or world state. Must be in 1..=1000000.
max_player_rows = 10000

# Per-player throttles (milliseconds) for the other inbound message classes,
# mirroring the rotation-proof, memory-bounded trade limiter above. A message
# beyond the configured rate is dropped before it drives work; an idempotent
# econ replay is never throttled. Each must be in 0..=3600000 (0 disables it).
#
# client_state: caps how often a player's position update drives the grid/AoI
# recompute. Keep it well below the client's send period (1000 / snapshot_hz).
client_state_min_interval_ms = 20
# chat: caps outbound chat fan-out to AoI subscribers.
chat_min_interval_ms = 500
# econ: caps new ledger transactions (replays of an applied txn are exempt).
econ_min_interval_ms = 100
# moor: caps new mooring commits (a MoorRequest writes a persistent moorage
# record, so an unthrottled flood is a DoS on persistent state).
moor_min_interval_ms = 250

# Maximum length in bytes of any inbound wire string (chat text, econ note,
# mooring name). A message carrying a longer string is rejected before it is
# stored or rebroadcast. Must be in 1..=4096.
max_wire_string_len = 512

# Human-readable server name returned in ServerHello.
server_name = "Sailwind Online (dev)"
