[workspace]
members = [
    "crates/sw-contracts",
    "crates/sw-net",
    "crates/sw-world",
    "crates/sw-econ",
    "crates/sw-persist",
    "crates/sw-server",
]
# The cargo-fuzz crate is deliberately excluded: libfuzzer-sys needs a nightly
# toolchain, so the fuzz target must never be built by the stable `make validate`
# / CI workspace. It carries its own `[workspace]` too, and is built only by the
# non-blocking nightly fuzz CI job.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.86.0"

# Machine-enforced lint floor for the whole workspace. Crates opt in with
# `[lints] workspace = true`. Kept green by fixing findings, never by blanket
# allows.
#
# `unsafe_code = "forbid"` is a hard cap the code cannot locally lift. The one
# exception is `sw-contracts`, whose `src/generated/` FlatBuffers bindings are
# verbatim compiler output built on the unsafe flatbuffers runtime; that crate
# declares its own lint table (still deny-strict on everything else) instead of
# inheriting the forbid. Every other crate inherits this table unchanged.
# Groups carry priority -1 so the specific `unsafe_code` lint (priority 0) resolves
# on top of them; cargo rejects a group and a lint sharing the same priority.
[workspace.lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
flatbuffers = "=25.2.10"
rusqlite = { version = "0.32.1", features = ["bundled"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.9"

# Internal crates
sw-contracts = { path = "crates/sw-contracts" }
sw-net = { path = "crates/sw-net" }
sw-world = { path = "crates/sw-world" }
sw-econ = { path = "crates/sw-econ" }
sw-persist = { path = "crates/sw-persist" }

[profile.release]
opt-level = 3
lto = "thin"
