# cargo-deny configuration for the server workspace.
#
# cargo-deny is not a pinned toolchain component, so it is not part of
# `make validate`; this file is kept accurate so `cargo deny check` passes for
# anyone who runs it (and for a future CI job that installs the tool).

[advisories]
version = 2
# A dependency the registry has pulled must not silently stay in the tree.
yanked = "deny"

[licenses]
version = 2
# Every current dependency's SPDX expression resolves to one of these. The
# tightest constraint is "(MIT OR Apache-2.0) AND Unicode-3.0", which needs
# Unicode-3.0 alongside MIT/Apache; every other crate is MIT/Apache-satisfiable.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions and version wildcards are surfaced but not fatal; the
# intra-workspace path deps legitimately carry no version requirement.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only crates.io. An unknown registry or git source is a supply-chain surprise.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
